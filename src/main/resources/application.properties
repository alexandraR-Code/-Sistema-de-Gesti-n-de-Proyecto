spring.application.name=proyectos

# Conexión a la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/proyectos
spring.datasource.username=postgres
spring.datasource.password=0123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework=INFO
logging.level.org.proyectos.SQL=DEBUG
logging.level.org.proyectos.orm.jdbc.bind=TRACE
