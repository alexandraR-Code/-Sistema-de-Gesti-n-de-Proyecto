spring.application.name=proyectos

# Conexion a la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/proyectos_db
spring.datasource.username=postgres
spring.datasource.password=0123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


logging.level.org.springframework=INFO
logging.level.org.proyectos.SQL=DEBUG
logging.level.org.proyectos.orm.jdbc.bind=TRACE
